[package]
name = "utah-core"
version = "0.1.0"
edition = "2021"

[dependencies]
wry = "0.24"
tao = { version = "0.16", features = ["tray"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.29", features = ["bundled"] }
keyring = "2.0"
self_update = { version = "0.39", features = ["archive-zip", "compression-zip-deflate"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true