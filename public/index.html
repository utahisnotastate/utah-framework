<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utah Environment</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; padding-top: 50px; height: 100vh; margin: 0; }
        .console { background: #1e293b; padding: 2rem; border-radius: 8px; border: 1px solid #334155; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); width: 600px; }
        h1 { margin-top: 0; color: #38bdf8; font-size: 1.5rem; letter-spacing: 2px; text-transform: uppercase; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; }
        button { background: #0ea5e9; color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0284c7; }
        #output { background: #000; padding: 15px; border-radius: 4px; color: #10b981; font-family: monospace; white-space: pre-wrap; overflow-x: auto; min-height: 100px; }
    </style>
</head>
<body>
    <div class="console">
        <h1>Utah Protocol: L6</h1>
        <div class="controls">
            <button onclick="pingEngine()">Ping Engine</button>
            <button onclick="readManifest()">Read package.json</button>
        </div>
        <div id="output">Awaiting Data...</div>
    </div>

    <script>
        const output = document.getElementById('output');

        // Listen for Bi-Directional events from Rust
        window.addEventListener('system:ping', (e) => {
            output.innerText = `[PING SUCCESS]\n${e.detail.payload}`;
        });

        window.addEventListener('fs:read', (e) => {
            output.innerText = `[FILE SYSTEM DATA]\n${e.detail.payload}`;
        });

        // Trigger UI Actions
        function pingEngine() {
            output.innerText = "Dispatching telemetry to background thread...";
            window.Utah.sys.ping();
        }

        function readManifest() {
            output.innerText = "Accessing native disk...";
            window.Utah.fs.readFile('package.json');
        }
    </script>
</body>
</html>
